# RuView sensing-server configuration
# This file is sourced as an environment file by ruview-sensing.service.
# After editing, run:  systemctl restart ruview-sensing

# Bind address for all servers (HTTP, WS, UDP). 0.0.0.0 = all interfaces.
RUVIEW_BIND_ADDR=0.0.0.0

# CSI source:
#   esp32    — live ESP32 nodes over UDP (production)
#   simulate — synthetic CSI for demos / no hardware
#   file     — replay a recording
RUVIEW_SOURCE=esp32

# UDP port ESP32 nodes push CSI to.
RUVIEW_UDP_PORT=5005

# REST API port (curl http://<host>:3022/health).
RUVIEW_HTTP_PORT=3022

# WebSocket port for the live snapshot stream (10 Hz).
RUVIEW_WS_PORT=3023

# Internal tick rate in milliseconds. 100 = 10 Hz updates.
RUVIEW_TICK_MS=100

# Enable RK3588 NPU acceleration (1 = on, 0 = off). Requires librknnrt.
RUVIEW_USE_NPU=1

# Rust log level: error | warn | info | debug | trace
RUST_LOG=info

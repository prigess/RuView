# ESPHome configuration for the RuView "Node 7" radar device.
#
# Hardware:  Espressif ESP32-C6 (RISC-V) + Seeed MR60BHA2 60 GHz mmWave radar.
# Role:      Standalone radar publisher — does NOT do CSI sensing. Pushes
#            presence, distance, heart rate, breathing rate, and target count
#            to the Pi sensing-server over HTTP every second.
#
# Why ESPHome instead of the custom RuView firmware:
#   - The custom firmware's `radar_type=0` bug is unresolved (see ADR-pending).
#   - ESPHome ships a mature, well-tested Seeed MR60BHA2 component.
#   - Configuration is declarative YAML — no NVS provisioning gymnastics.
#   - Native OTA + encrypted API + auto-reconnect WiFi out of the box.
#
# Build & flash:
#   cd firmware/esphome
#   cp secrets.yaml.example secrets.yaml   # then edit credentials
#   esphome run ruview-c6-radar.yaml       # builds and flashes via USB
#
# After install:
#   curl http://<c6-ip>/sensor/heart_rate  # smoke test
#   The Pi sensing-server polls these endpoints (see scripts/c6-radar-poll.py).

substitutions:
  device_name: ruview-c6-radar
  device_friendly: "RuView Radar (Node 7)"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly}
  # Run the C6's heart-beat at 250ms in case the radar pipeline needs to
  # publish faster than the default 1Hz scheduler tick.
  on_boot:
    priority: 600
    then:
      - logger.log: "RuView C6 radar booted"

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf
    version: recommended

# ── WiFi ────────────────────────────────────────────────────────────────────
#
# - power_save_mode: NONE — keeps the radio responsive at the cost of mA;
#   matches our experience that PS triggers silent UDP drops on this mesh.
# - bssid lock to "AP B" (14:22:db:bc:7b:e6) — the AP confirmed working from
#   the Pi side. Remove the lock once the upstream mesh isolation is fixed.
# - fast_connect — skips full scan after first boot. Saves ~2s on reconnect.
# - reboot_timeout: 0s — never reboot on WiFi drop; keep retrying instead.
wifi:
  power_save_mode: NONE
  fast_connect: true
  reboot_timeout: 0s
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      bssid: "14:22:db:bc:7b:e6"   # AP B — confirmed working
      priority: 10
    # Fallback to any matching SSID if locked BSSID is out of range.
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
      priority: 1

# ── Native ESPHome API (for HA + remote diagnostics + OTA hand-off) ─────────
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

# ── MQTT — minimal config (rollback-safe attempt #3) ──────────────────────
#
# Earlier richer configs (birth/will + reboot_timeout) crashed the C6 during
# boot; safe-mode rolled back to the previous firmware. Stripped to bare
# essentials. Pi `ruview-sensing` server subscribes to
# `ruview-c6-radar/sensor/+/state` and `.../binary_sensor/+/state`.
# `discovery: false` keeps Home Assistant discovery noise off the broker.
mqtt:
  broker: !secret mqtt_broker_host
  port: 1883
  topic_prefix: ruview-c6-radar
  discovery: false

# ── OTA updates ─────────────────────────────────────────────────────────────
ota:
  - platform: esphome
    password: !secret ota_password

# ── Web server: simple HTTP/JSON endpoint the Pi can poll ──────────────────
#
# After install:
#   curl http://<c6-ip>/                       # device overview
#   curl http://<c6-ip>/sensor/heart_rate      # one sensor JSON
#   curl http://<c6-ip>/binary_sensor/person_present
web_server:
  port: 80
  version: 3
  include_internal: false

logger:
  level: INFO
  baud_rate: 115200

# ── UART to the MR60BHA2 (TX=GPIO16, RX=GPIO17, 115200 8N1) ────────────────
uart:
  id: mmwave_uart
  tx_pin: GPIO16
  rx_pin: GPIO17
  baud_rate: 115200
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 256

# ── MR60BHA2 component ─────────────────────────────────────────────────────
seeed_mr60bha2:
  id: mr60bha2
  uart_id: mmwave_uart

# ── Sensors ─────────────────────────────────────────────────────────────────
sensor:
  - platform: seeed_mr60bha2
    breath_rate:
      name: "Breath Rate"
      id: breath_rate
      filters:
        - filter_out: 0   # discard zero readings (init / no target)
    heart_rate:
      name: "Heart Rate"
      id: heart_rate
      filters:
        - filter_out: 0
    distance:
      name: "Target Distance"
      id: target_distance
      filters:
        - filter_out: 0
    num_targets:
      name: "Target Count"
      id: num_targets

  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 10s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# ── Binary sensors ──────────────────────────────────────────────────────────
binary_sensor:
  - platform: seeed_mr60bha2
    has_target:
      name: "Person Present"
      id: person_present
      filters:
        - delayed_off: 2s   # ride out brief drop-outs

  - platform: status
    name: "Status"

# ── Text sensors (network diagnostics) ──────────────────────────────────────
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
    ssid:
      name: "Connected SSID"
    bssid:
      name: "Connected BSSID"
      id: bssid_text
    mac_address:
      name: "MAC Address"

# ── Diagnostic button: reboot from the web UI ───────────────────────────────
button:
  - platform: restart
    name: "Restart"

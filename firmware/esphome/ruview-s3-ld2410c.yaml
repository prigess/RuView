# ESPHome configuration for a RuView LD2410C presence node.
#
# Hardware:  ESP32-S3 (VCC-GND Studio YD clone) + Hi-Link LD2410C 24 GHz radar.
# Role:      Presence + moving/still distance + energy (single aggregate
#            target — NOT multi-target X/Y like the LD2450).
#
# Wiring (LD2410C → ESP32-S3), matching the LD2450 node's proven layout:
#   VCC → 5Vin   (needs real 5V — on the YD clone bridge the front IN-OUT
#                 jumper, or feed external 5V with common ground)
#   GND → GND
#   TX  → GPIO12 (S3 RX ← LD2410 TX)   NOTE: that header slot is GPIO12,
#   RX  → GPIO11 (S3 TX → LD2410 RX)         often mis-counted as "pin 18/17"
#   Go by the silkscreen GPIO number, not the physical pin position.
#
# LD2410C UART factory default is 256000 8N1 (some batches ship at 115200).
#
# First-flash (USB):
#   esphome run ruview-s3-ld2410c.yaml --device /dev/cu.wchusbserialXXXX

substitutions:
  device_name: ruview-s3-ld2410c
  device_friendly: "RuView LD2410C (Presence)"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly}
  on_boot:
    priority: 600
    then:
      - logger.log: "RuView LD2410C presence node booted"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended
  flash_size: 8MB

wifi:
  power_save_mode: NONE
  fast_connect: false
  reboot_timeout: 0s
  networks:
    - ssid: !secret wifi_ssid_hotspot
      password: !secret wifi_password_hotspot
      priority: 10
    - ssid: !secret wifi_ssid_home
      password: !secret wifi_password_home
      priority: 5

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  broker: !secret mqtt_broker_host
  port: 1883
  topic_prefix: ruview-s3-ld2410c
  discovery: false

web_server:
  port: 80
  version: 3
  include_internal: false

logger:
  level: INFO
  baud_rate: 115200

# ── UART to LD2410C (GPIO11/12, 256000 8N1) ────────────────────────────────
uart:
  id: ld2410_uart
  tx_pin: GPIO11    # ESP TX → LD2410 RX
  rx_pin: GPIO12    # ESP RX ← LD2410 TX
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:
  uart_id: ld2410_uart
  id: ld2410_radar

sensor:
  - platform: ld2410
    moving_distance:
      name: "Moving Target Distance"
      id: moving_distance
    still_distance:
      name: "Still Target Distance"
      id: still_distance
    moving_energy:
      name: "Moving Target Energy"
      id: moving_energy
    still_energy:
      name: "Still Target Energy"
      id: still_energy
    detection_distance:
      name: "Detection Distance"
      id: detection_distance

  - platform: wifi_signal
    name: "WiFi RSSI"
    id: wifi_rssi
    update_interval: 10s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Person Present"
      id: person_present
      filters:
        - delayed_off: 3s
    has_moving_target:
      name: "Moving Target Present"
      id: moving_target_present
    has_still_target:
      name: "Still Target Present"
      id: still_target_present

  - platform: status
    name: "Status"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    mac_address:
      name: "MAC Address"

button:
  - platform: restart
    name: "Restart"

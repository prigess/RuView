# ESPHome configuration for the RuView "Node 2" — north position.
#
# Hardware:  ESP32-S3-DevKitC-1 (N16R8) + INMP441 I²S MEMS microphone.
# Role:      Audio sensing — RMS sound level, eventually impact detection
#            (Tier B in Appendix D of the setup paper).
#
# Wiring (INMP441 → ESP32-S3):
#   VDD → 3V3        (★ NOT 5V — INMP441 is 3.3 V only)
#   GND → GND
#   L/R → GND        (mono operation, left channel)
#   SCK → GPIO15     (I²S BCLK / bit-clock)      ← verified working
#   WS  → GPIO16     (I²S LRCK / word-select)    ← verified working
#   SD  → GPIO4      (I²S data → ESP)
#   NOTE: go by the SILKSCREEN GPIO number, not physical pin position.
#
# Replaces the CSI firmware on Node 2 while testing the audio path.
# When the LD2450s land, Node 2 will host the radar instead and the mic
# moves to a different S3.

substitutions:
  device_name: ruview-s3-mic-n2
  device_friendly: "RuView Node 2 — Audio (Mic)"

esphome:
  name: ${device_name}
  friendly_name: ${device_friendly}
  on_boot:
    priority: 600
    then:
      - logger.log: "RuView Node 2 (S3 + INMP441) booted"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    version: recommended
  flash_size: 8MB

# ── WiFi (same portable strategy as other RuView devices) ──────────────────
wifi:
  power_save_mode: NONE
  fast_connect: false
  reboot_timeout: 0s
  networks:
    - ssid: !secret wifi_ssid_hotspot
      password: !secret wifi_password_hotspot
      priority: 10
    - ssid: !secret wifi_ssid_home
      password: !secret wifi_password_home
      priority: 5

# ── Native API for ESPHome's `logs` and OTA tooling ────────────────────────
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

# ── MQTT — same broker pattern as other RuView devices ──────────────────────
mqtt:
  broker: !secret mqtt_broker_host
  port: 1883
  topic_prefix: ruview-s3-mic-n2
  discovery: false

web_server:
  port: 80
  version: 3

logger:
  level: INFO
  baud_rate: 115200

# ── External sound-level-meter component ───────────────────────────────────
# stas-sl/esphome-sound-level-meter: I²S → RMS / SPL on-device, low CPU.
external_components:
  - source: github://stas-sl/esphome-sound-level-meter
    refresh: 0s

# ── I²S bus to the INMP441 ─────────────────────────────────────────────────
i2s:
  id: i2s_in
  bck_pin: GPIO15    # SCK (bit clock)
  ws_pin: GPIO16     # WS  (word select)
  din_pin: GPIO4     # SD  (data in)
  sample_rate: 48000
  bits_per_sample: 32
  channel: left         # INMP441 with L/R tied to GND = LEFT channel
  use_apll: true

# ── Sound level meter — with DC blocker and longer warmup ──────────────────
sound_level_meter:
  id: slm
  i2s_id: i2s_in
  buffer_size: 4096
  warmup_interval: 2000ms
  groups:
      # No DC-blocker filter: the previous 30 Hz SOS high-pass diverged to
      # +inf on the INMP441's large DC offset. Running raw gives clean, live
      # readings (~-40 to -57 dB). TODO: revisit with a stable HPF for SPL.
    - sensors:
        - type: eq
          name: "Audio Level (Leq)"
          id: audio_leq_db
          update_interval: 200ms
          accuracy_decimals: 1
          unit_of_measurement: "dB"
        - type: peak
          name: "Audio Peak"
          id: audio_peak_db
          update_interval: 200ms
          accuracy_decimals: 1
          unit_of_measurement: "dB"

sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    update_interval: 10s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

binary_sensor:
  - platform: status
    name: "Status"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    bssid:
      name: "Connected BSSID"
    mac_address:
      name: "MAC Address"
